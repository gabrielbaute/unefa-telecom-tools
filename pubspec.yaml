name: unefa_telecom_tools
description: "Una app de utilería para el estudiante de Telecomunicaciones de la UNEFA."
publish_to: 'none'
version: 0.4.2+7

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.3.0
  package_info_plus: ^10.1.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_post_build: ^1.3.0

flutter_post_builder:
  package_name: "unefa-telecom-tools"
  append_version: true
  final_directory: "./release"
  move_files: true
  discard:
    v7a: false
    a64: false
    x86: false
    uni: false
  clean_build_folder: true

flutter:
  uses-material-design: true
